# What the `pulseengine` realm carries.
#
# THIS FILE IS THE LAYER. Bumping a version here is the whole change — no
# workflow edit, no varve commit (REQ-PEL-MANIFEST-001).
#
# `varve` is obtained from a release, along with the assembler that reads
# this file. Neither is vendored here (REQ-PEL-ASSEMBLER-001).

[varve]
# The varve release whose binary AND assembler build this layer. Pinned, so a
# layer can be traced to the assembler that produced it.
#
# v0.32.0, not v0.30.0: `varve-producer` — the assembler that reads THIS file —
# does not exist before v0.31.0. Pinned at v0.30.0 the deposit downloaded a
# varve binary, found no assembler beside it, and could not have run whatever
# the adapter step said.
version = "v0.32.0"

[realm]
name    = "pulseengine"
channel = "rolling"
# The registry the deposit is pushed to. The trust root is NOT here — it is
# the public half consumers already hold; this repo holds the secret half as
# a secret, never as a file (REQ-PEL-CUSTODY-001).
registry = "oci://ghcr.io/pulseengine/varve/layers"

# ── tools ───────────────────────────────────────────────────────────────────
# `repo` is optional and defaults to `pulseengine/<name>`. Naming it lets a
# non-PulseEngine upstream be expressed, which is what varve's second
# ingestion mechanism exists for (varve REQ-INGEST-001).
#
# `binary` is optional and defaults to <name>; kiln ships its CLI as `kilnd`.
#
# The versions below are the contents of the live rolling layer 2026.09.1
# (read back from ghcr.io/pulseengine/varve/layers), so the first deposit made
# from this repository carries what the realm already carries rather than a
# quietly older toolchain.

[[tool]]
name    = "rivet"
version = "v0.35.0"

[[tool]]
name    = "spar"
version = "v0.40.0"

[[tool]]
name    = "synth"
version = "v0.61.0"

[[tool]]
name    = "witness"
version = "v0.43.0"

[[tool]]
name    = "ordeal"
version = "v0.19.0"

# loom v1.4.1 publishes no aarch64-unknown-linux-gnu build. The assembler
# reports the payload it could not place by name and deposits the three
# platforms that exist; the live layer carries the same three.
[[tool]]
name    = "loom"
version = "v1.4.1"

[[tool]]
name    = "meld"
version = "v0.53.0"

[[tool]]
name    = "kiln"
version = "v0.4.4"
binary  = "kilnd"

# The assembler rides in the layer like any other tool, so the NEXT deposit
# can pin an assembler this realm has signed rather than one fetched ad hoc.
# The repo is `varve`, the payload is `varve-producer`, so `repo` is spelled
# out; the default asset template (`<name>-<version>-%T.tar.gz`) already names
# `varve-producer-v0.32.0-<triple>.tar.gz` exactly, so no `asset` is needed.
[[tool]]
name    = "varve-producer"
repo    = "pulseengine/varve"
version = "v0.32.0"

# wsc ships as raw per-platform binaries from sigil, not a tarball.
[[tool]]
name    = "wsc"
repo    = "pulseengine/sigil"
version = "v0.11.0"
layout  = "raw-per-platform"
# sigil names these `wsc-<os>-<arch>` -- OS first. Neither %T
# (aarch64-apple-darwin) nor %U (aarch64-macos) produces that order, so the
# names are given explicitly rather than inferred. The shell assembler only
# ever worked here because it carried a hardcoded `case` for wsc; naming the
# files removes that special case and makes the manifest the only place the
# layer's contents are defined.
[tool.asset-for]
"aarch64-apple-darwin"      = "wsc-macos-aarch64"
"x86_64-apple-darwin"       = "wsc-macos-x86_64"
"aarch64-unknown-linux-gnu" = "wsc-linux-aarch64"
"x86_64-unknown-linux-gnu"  = "wsc-linux-x86_64"

# ── with-device: NOT carried, and the reason is a gap in the manifest schema ─
#
# The live layer carries `with-device` from the `jess` hub, where the release
# TAG and the payload's own version are different numbers: jess v0.7.1 ships
# with-device 0.2.1, jess v0.7.2 ships with-device 0.2.2. The layer records
# `tool.version = 0.2.1` beside `source.release = v0.7.1` — because the shell
# assembler's TARBALL_TOOLS encoding had a fifth field for exactly this.
#
# layer.toml has no such field. `version` is BOTH the release tag the
# assembler asks GitHub for AND, with one leading `v` stripped, the version
# written into the signed layer (varve-producer main.rs: `bare_version`).
# So the entry can be written two ways and neither is correct:
#
#   version = "v0.7.2"  -> the asset can be named explicitly, but the layer
#                          would state that this binary is `with-device
#                          0.7.2`, which it is not. A signed claim about the
#                          layer's own contents that is false is the one thing
#                          this file exists not to produce.
#   version = "0.2.2"   -> the recorded version is right, but the assembler
#                          asks jess for a release tagged `0.2.2`, which does
#                          not exist, and the deposit fails at the fetch.
#
# So the payload is left out, loudly, rather than deposited under a version it
# does not answer to. Restore this entry once varve can express a release tag
# distinct from a payload version (varve#132):
#
#   [[tool]]
#   name    = "with-device"
#   repo    = "pulseengine/jess"
#   version = "v0.7.2"        # tag; payload answers `with-device 0.2.2`
#   asset   = "with-device-0.2.2-%T.tar.gz"

# ── VS Code extensions (kind = "vsix") ──────────────────────────────────────
# `%V` is the bare version; `%P` the VS Code platform tag where the extension
# is per-platform. An entry with no %P is one portable package.

[[vsix]]
name    = "rivet-sdlc"
repo    = "pulseengine/rivet"
version = "v0.35.0"
asset   = "rivet-sdlc-%V.vsix"

[[vsix]]
name    = "spar-aadl"
repo    = "pulseengine/spar"
version = "v0.40.0"
asset   = "spar-aadl-%P-%V.vsix"
