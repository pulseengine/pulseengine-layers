# What the `pulseengine` realm carries.
#
# THIS FILE IS THE LAYER. Bumping a version here is the whole change — no
# workflow edit, no varve commit (REQ-PEL-MANIFEST-001).
#
# `varve` is obtained from a release, along with the assembler that reads
# this file. Neither is vendored here (REQ-PEL-ASSEMBLER-001).

[varve]
# The varve release whose binary AND assembler build this layer. Pinned, so a
# layer can be traced to the assembler that produced it.
#
# v0.32.0, not v0.30.0: `varve-producer` — the assembler that reads THIS file —
# does not exist before v0.31.0. Pinned at v0.30.0 the deposit downloaded a
# varve binary, found no assembler beside it, and could not have run whatever
# the adapter step said.
#
# v0.32.1, not v0.32.0: this pin also decides which `rolling.pub` the deposit
# downloads, and the rolling root was ROTATED in v0.32.1 (varve#110, #136 —
# the old root existed only as an unreadable Actions secret, so it could never
# be given to this repository). VARVE_ROLLING_KEY here is already the new
# secret half. Pinned at v0.32.0 the deposit would fetch the OLD public root,
# sign with the NEW key, and fail its own sanity install — correctly, since
# that check exists to catch exactly this mismatch on the runner rather than
# on every consumer's machine.
#
# v0.33.0, not v0.32.1: the ROLLING SUPPORT POLICY is one month as of v0.33.0
# and six months before it. Deposited with v0.32.1 this layer would state a
# support-until six months out — the same overstatement varve's
# REQ-POSTDEPOSIT-001 recorded as accepted for 2026.09.1 on the explicit
# condition that the NEXT layer carried a correct window. It did not, and this
# pin is why.
#
# v0.34.0, not v0.33.0: the v0.33.0 assembler PARSES this file's `release` key
# and then ignores it, so `with-device` below would be fetched by its payload
# version 0.2.2 — a jess release that does not exist — and the deposit dies at
# the fetch. That is not hypothetical; it is how the first 2026.09.3 attempt
# failed (varve REQ-PAYLOADID-001).
#
# v0.34.1, not v0.34.0: v0.34.0 read the key for the FETCH and not for the
# STAGING path, downloading with-device under `v0.7.2/` and then looking for it
# under `0.2.2/`. The second 2026.09.3 attempt got past fetch and verify and
# died unpacking a file that was never written there. v0.34.1 derives that path
# from the plan in one place, and makes the version-keyed form unreachable.
#
# v0.36.0, not v0.34.1: `[[crate]]` and `[[docs]]` below do not EXIST before
# v0.36.0 — the schema rejects them outright, so the deposit stops at parsing.
# And v0.35.0 is not enough: it accepted `[[docs]]` and then deposited every
# document UNLABELLED (signed as a plain tool, with no format), so
# `varve export-docs` found nothing in a layer that carried documentation
# (varve REQ-LAYERDOCS-001, fixed in v0.36.0).
version = "v0.36.0"

[realm]
name    = "pulseengine"
channel = "rolling"
# The registry the deposit is pushed to. The trust root is NOT here — it is
# the public half consumers already hold; this repo holds the secret half as
# a secret, never as a file (REQ-PEL-CUSTODY-001).
registry = "oci://ghcr.io/pulseengine/layers"

# ── tools ───────────────────────────────────────────────────────────────────
# `repo` is optional and defaults to `pulseengine/<name>`. Naming it lets a
# non-PulseEngine upstream be expressed, which is what varve's second
# ingestion mechanism exists for (varve REQ-INGEST-001).
#
# `binary` is optional and defaults to <name>; kiln ships its CLI as `kilnd`.
#
# The versions below are the contents of the live rolling layer 2026.09.1
# (read back from ghcr.io/pulseengine/varve/layers), so the first deposit made
# from this repository carries what the realm already carries rather than a
# quietly older toolchain.

[[tool]]
name    = "rivet"
version = "v0.37.0"

[[tool]]
name    = "spar"
version = "v0.40.0"

[[tool]]
name    = "synth"
version = "v0.69.0"

[[tool]]
name    = "witness"
version = "v0.43.0"

[[tool]]
name    = "ordeal"
version = "v0.19.0"

# loom v1.4.1 publishes no aarch64-unknown-linux-gnu build. The assembler
# reports the payload it could not place by name and deposits the three
# platforms that exist; the live layer carries the same three.
[[tool]]
name    = "loom"
version = "v1.4.1"

[[tool]]
name    = "meld"
version = "v0.58.1"

[[tool]]
name    = "kiln"
version = "v0.5.0"
binary  = "kilnd"

# The assembler rides in the layer like any other tool, so the NEXT deposit
# can pin an assembler this realm has signed rather than one fetched ad hoc.
# The repo is `varve`, the payload is `varve-producer`, so `repo` is spelled
# out; the default asset template (`<name>-<version>-%T.tar.gz`) already names
# `varve-producer-v0.32.0-<triple>.tar.gz` exactly, so no `asset` is needed.
# v0.33.0, not v0.32.0: carry-forward was INERT in every earlier producer — it
# built an OCI reference from a bare digest, which oras rejects at reference
# parsing before any network call, so every carried payload silently became a
# full upstream download and the failure was reported as the registry's.
# Carrying an older assembler would ship that bug into the layer.
[[tool]]
name    = "varve-producer"
repo    = "pulseengine/varve"
version = "v0.37.0"

# jess is a HUB: its v0.7.2 RELEASE ships `with-device` at payload version
# 0.2.2, so the release tag and the payload's own version are different
# numbers. `release` records the tag to fetch; `version` is what the payload IS
# and what goes into the signed manifest (varve REQ-PAYLOADID-001).
#
# Deriving the version from the tag would put `version = "0.7.2"` in the signed
# manifest for a binary that answers `with-device 0.2.2` — the layer stating
# something untrue about its own contents, which is the one thing it exists not
# to do.
#
# RESTORED after the realm move dropped it. The old realm carried it as a
# five-field TARBALL_TOOLS entry; that encoding did not survive translation to
# layer.toml, and nothing compared the two lists. gale found it by upgrading.
[[tool]]
name    = "with-device"
repo    = "pulseengine/jess"
version = "0.2.2"
release = "v0.7.2"
asset   = "with-device-%V-%T.tar.gz"

# wsc ships as raw per-platform binaries from sigil, not a tarball.
[[tool]]
name    = "wsc"
repo    = "pulseengine/sigil"
version = "v0.11.0"
layout  = "raw-per-platform"
# sigil names these `wsc-<os>-<arch>` -- OS first. Neither %T
# (aarch64-apple-darwin) nor %U (aarch64-macos) produces that order, so the
# names are given explicitly rather than inferred. The shell assembler only
# ever worked here because it carried a hardcoded `case` for wsc; naming the
# files removes that special case and makes the manifest the only place the
# layer's contents are defined.
[tool.asset-for]
"aarch64-apple-darwin"      = "wsc-macos-aarch64"
"x86_64-apple-darwin"       = "wsc-macos-x86_64"
"aarch64-unknown-linux-gnu" = "wsc-linux-aarch64"
"x86_64-unknown-linux-gnu"  = "wsc-linux-x86_64"

# ── VS Code extensions (kind = "vsix") ──────────────────────────────────────
# `%V` is the bare version; `%P` the VS Code platform tag where the extension
# is per-platform. An entry with no %P is one portable package.

[[vsix]]
name    = "rivet-sdlc"
repo    = "pulseengine/rivet"
version = "v0.37.0"
asset   = "rivet-sdlc-%V.vsix"

[[vsix]]
name    = "spar-aadl"
repo    = "pulseengine/spar"
version = "v0.40.0"
asset   = "spar-aadl-%P-%V.vsix"

# ── crates (kind = "crate") ─────────────────────────────────────────────────
# A Rust crate the layer carries, as the `.crate` file the release publishes.
# HELD, never dispatched; consumed by `varve export-cargo`,
# `export-crates-vendor` and `export-bazel-distdir`.
#
# Taken from the varve RELEASE, not from crates.io: the release asset is
# covered by cosign over SHA256SUMS.txt, so the crate is proven the way every
# other payload of that release is, instead of arriving over a second trust
# path. The bytes are the ones crates.io serves — `cargo package` is
# reproducible, varve's release checks its own `.crate` against the registry
# index on every tag, and that check passed on v0.36.0.
#
# This is the point of REQ-CRATEPAYLOAD-001: varve tells consumers to depend on
# varve-core rather than shell out, and until now that was the one dependency
# they could not pin — fetched unpinned, unverified by the realm root, and only
# with a network, inside a toolchain whose whole purpose is the opposite.
#
# `version` is the crate's own version as the registry index spells it (bare),
# `release` is the tag to fetch. The asset defaults to `<name>-%V.crate`.
[[crate]]
name    = "varve-core"
repo    = "pulseengine/varve"
version = "0.37.0"
release = "v0.37.0"

# ── documentation (kind = "docs") ───────────────────────────────────────────
# The API documentation for the crate above, and `documents` is what ties the
# two together: `varve export-docs --for varve-core` answers with THIS payload
# because it says it documents that crate, not because of what it is called.
#
# varve deposit refuses a `documents` naming no payload of the layer, so this
# entry and the `[[crate]]` above stand or fall together — remove the crate and
# the deposit fails rather than signing a document of nothing.
#
# tar.gz rather than zip, on a measurement recorded in varve
# REQ-LAYERDOCS-001: 3.4 MB compressed, ~10 ms to decompress whole, which
# `varve-serve` pays once at start.
[[docs]]
name      = "varve-core-api"
repo      = "pulseengine/varve"
version   = "0.37.0"
release   = "v0.37.0"
format    = "rustdoc"
entry     = "varve_core/index.html"
title     = "varve-core API"
documents = "varve-core"
asset     = "varve-core-%V-rustdoc.tar.gz"
