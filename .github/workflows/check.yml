name: check

# The scanner decides, with no person in the loop, what an immutable signed
# layer pins — and this repository had no test job at all, so its two defects
# (only `[[tool]]` scanned; a hub payload's version taken from a release tag)
# were found by reading rather than by running. A gate that runs on every change
# is what makes the next one cheaper to find.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: the manifest parses and the scanner's rules hold
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: the scanner's rules
        # No network: `plan` takes the "latest release" function as an
        # argument, so the rules are tested without asking a forge anything.
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: the manifest itself
        env:
          # Required, and its absence is why this job first went red: `gh` with
          # no token cannot ask, `gh release view` exits non-zero, and the
          # checker used to read that as "the release does not exist" — eleven
          # correct pins reported missing, including one published minutes
          # earlier. The checker now says "could not ask" instead, and the
          # token is what lets it ask. Cross-repo reads work with the default
          # token because every pinned repository here is public; the deposit
          # workflow reads them the same way.
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/check-manifest.py

  # Committed scripts get run on macOS, where /bin/bash is 3.2 and
  # /usr/bin/python3 is 3.9, while every other job here runs newer tools, so
  # nothing caught a script that only works on the newer ones. Both tools are
  # pinned: shellcheck by sha256 into a job-local path (called as
  # "$SHELLCHECK", never by PATH lookup), Python by setup-python's interpreter
  # path. curl, not `gh`: self-hosted runners do not have the GitHub CLI.
  script-portability:
    name: Script portability (shellcheck + Python 3.9 floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SHELLCHECK_SHA256 is the release asset's `digest` for
      # shellcheck-v0.11.0.linux.x86_64.tar.gz from
      # https://github.com/koalaman/shellcheck/releases/tag/v0.11.0,
      # re-hashed locally on 2026-10-29. .tar.gz, not .tar.xz: no xz needed.
      - name: Install shellcheck (pinned by path and sha256)
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION"
          asset="shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.gz"
          rm -rf "$dir" && mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$asset" \
            "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/$asset"
          echo "$SHELLCHECK_SHA256  $dir/$asset" | sha256sum -c -
          tar xzf "$dir/$asset" -C "$dir" --strip-components=1 "shellcheck-v$SHELLCHECK_VERSION/shellcheck"
          got=$("$dir/shellcheck" --version | sed -n 's/^version: //p')
          if [ "$got" != "$SHELLCHECK_VERSION" ]; then
            echo "::error::pinned shellcheck reports '$got', expected '$SHELLCHECK_VERSION'"
            exit 1
          fi
          echo "SHELLCHECK=$dir/shellcheck" >> "$GITHUB_ENV"

      # Severity warning and up. Info-level findings (SC2086 and friends) are
      # not gated.
      - name: shellcheck tracked shell scripts
        run: |
          set -euo pipefail
          git ls-files -z '*.sh' '*.bash' | xargs -0 -r "$SHELLCHECK" -S warning

      - id: py39
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"

      # Under 3.9 the compile step is the real 3.9 parser; the AST pass catches
      # what parses on 3.9 but fails when it runs (unguarded tomllib, `X | None`
      # annotations without `from __future__ import annotations`, ...). The
      # self-test first: a checker only ever seen to pass could not fail.
      - name: Python 3.9 floor
        env:
          PY39: ${{ steps.py39.outputs.python-path }}
        run: |
          set -euo pipefail
          "$PY39" -c 'import sys; assert sys.version_info[:2] == (3, 9), sys.version'
          "$PY39" tools/check-py-floor.py --self-test
          git ls-files -z '*.py' | xargs -0 -r "$PY39" tools/check-py-floor.py
